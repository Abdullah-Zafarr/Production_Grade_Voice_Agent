<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Test Home Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #0b3363, #1e40af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        p {
            font-size: 1.25rem;
            color: #64748b;
            max-width: 600px;
            line-height: 1.6;
        }
        .container {
            padding: 3rem;
            border-radius: 32px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Soulbot Widget Testing</h1>
        <p>This is a sample home page to test the Voice Agent widget. Look at the bottom right corner to interact with the agent.</p>
    </div>

    <!-- Embed the optimized widget script -->
    <script 
        src="../widget.js" 
        data-position="bottom-right"
        data-color="#0b3363"
        data-text="Talk to our agent"
    ></script>
</body>
</html>
